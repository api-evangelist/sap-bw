specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: SAP BW
providerId: sap-bw
created: '2026-05-04'
modified: '2026-08-29'
generated: '2026-08-29'
method: searched
source: SAP Help Portal SAP BW/4HANA documentation set (help.sap.com search API)
description: >-
  SAP publishes no rate limits for SAP BW, and structurally cannot: there is
  no vendor-operated endpoint to throttle. SAP BW/4HANA runs in the customer's
  own SAP NetWeaver AS ABAP landscape, so the effective ceiling on API calls
  is that customer's own configuration - dialog and background work processes,
  ICM connection limits, the DTP package size and parallelism settings, and
  the SAP HANA statement memory limits. None of those emit a rate-limit
  header, and none of them are a published SAP limit.
tags:
  - Business Intelligence
  - Data Warehousing
  - Enterprise
  - ETL
  - SAP
  - Rate Limiting
limit_count: 0
limits: []
headers: {}
headers_note: >-
  No X-RateLimit-*, RateLimit-* or Retry-After signalling is documented on any
  SAP BW surface. An agent calling BW gets no runtime capacity signal at all;
  it learns it has exceeded capacity by getting a timeout or an ABAP short
  dump, not by reading a header.
responseCodes: {}
customer_controlled_ceilings:
  - name: AS ABAP work processes
    description: >-
      Dialog and background work-process counts on the ABAP application
      server bound concurrent request handling. Customer-configured.
  - name: DTP package size and parallelism
    description: >-
      Data transfer process settings bound extraction throughput.
      Customer-configured per DTP.
    docs: https://help.sap.com/docs/SAP_BW4HANA/107a6e8a38b74ede94c833ca3b7b6f51/4e1e85bf7d7443949ea24419960bf918.html
evidence:
  - source: help.sap.com search API, product=SAP_BW4HANA
    finding: >-
      No documentation page in the SAP BW/4HANA set describes a request rate
      limit, quota, throttle or 429 response for any BW API surface.
note: >-
  This file previously carried a bulk-sweep scaffold inventing a free tier of
  10 requests/minute with a full X-RateLimit-* header set and 429 semantics.
  None of that is published by SAP. It has been replaced with the searched
  finding; limit_count 0 is the honest measurement.

description: >-
  SAP publishes no plans, tiers, quotas or list prices for SAP BW. The product
  page is a contact-sales surface: the only conversion path on
  sap.com/products/data-cloud/business-warehouse.html is a "Connect with SAP"
  registration/contact form. There is no /pricing page - probed
  sap.com/products/technology-platform/bw4hana/pricing.html (404) and
  sap.com/products/technology-platform/bw4hana.html (404, the product now
  lives under /products/data-cloud/business-warehouse.html). SAP BW/4HANA is
  licensed under an enterprise agreement, and SAP BW in SAP Business Data
  Cloud is sold on SAP's capacity-unit commercial model; neither is published
  as a self-serve plan.

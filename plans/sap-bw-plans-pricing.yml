        description: Per-request price after monthly quota is exceeded
        name: overage
        type: metered
        metric: requests
        limit: -1
        timeFrame: month
        geo: global
        domains:
          - https://sap-host/sap/opu/odata/sap/
          - https://sap-host/sap/bc/
          - https://help.sap.com/docs/SAP_BUSINESSOBJECTS_ANALYSIS_OFFICE
        unit: 1000
        price: TBD
        userMultiplied: false

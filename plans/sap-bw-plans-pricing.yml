        name: rate_limit
        type: rate
        metric: requests_per_minute
        limit: 1000
        timeFrame: minute
        geo: configurable
        domains:
          - https://sap-host/sap/opu/odata/sap/
          - https://sap-host/sap/bc/
          - https://help.sap.com/docs/SAP_BUSINESSOBJECTS_ANALYSIS_OFFICE
        unit: 1
        price: custom
        userMultiplied: false
    elements:
      - name: Unlimited / Negotiated Volume
      - name: 24/7 Dedicated Support
      - name: Contractual SLA
      - name: Security & Compliance Review

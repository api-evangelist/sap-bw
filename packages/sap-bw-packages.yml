description: >-
  SAP publishes no client library dedicated to SAP BW. What it does publish,
  first-party, are the connectors an integration actually uses to reach a
  BW/4HANA system: the NetWeaver RFC bindings that drive the BAPI/RFC surface,
  and the SAP HANA drivers that reach the BW/4HANA database layer. Every entry
  below was read from the registry metadata endpoint on the generated date.
  No SAP-published, BW-specific SDK exists in any registry probed.

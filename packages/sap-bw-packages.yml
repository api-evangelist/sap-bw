registry_dated_count: 5
findings:
  - >-
    There is no SAP-published SDK for SAP BW itself in any public registry.
    The BW API surface is reached through generic SAP connectors.
  - >-
    The two connectors that actually drive the BW BAPI/RFC surface - PyRFC and
    node-rfc - both last shipped in 2023/2024 and are the stalest first-party
    artifacts in this profile.
  - >-
    The two SAP connectors most enterprises actually use for BW (JCo and NCo)
    have no public registry presence at all: they are login-gated downloads,
    so a consumer cannot resolve, pin, or audit them from a package manifest.
